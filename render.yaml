services:
  - type: web
    name: agentos-backend
    runtime: docker
    plan: free
    region: singapore
    numInstances: 1
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: AGENTOS_DATABASE_URL
        fromDatabase:
          name: agentos-db
          property: connectionString
      - key: AGENTOS_WORK_DIR
        value: /tmp/agentos-work
      - key: OLLAMA_API_KEY
        sync: false
      - key: AGENTOS_APP_PASSWORD
        sync: false
      - key: OLLAMA_MODEL
        value: gpt-oss:20b

databases:
  - name: agentos-db
    databaseName: agentos
    user: agentos
    plan: free
    region: singapore
    ipAllowList: []
